services:
  web:
    build: .
    ports:
      - "9000:5000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - redis
      # redis:
      #   condition: service_healthy

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    # healthcheck:
    #   test: ["CMD", "redis-cli", "ping"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3

volumes:
  redis-data:
